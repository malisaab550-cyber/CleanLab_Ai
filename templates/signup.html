<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — CleanLab AI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eef3ff,#f7f9fc 55%,#e8efff)}.wrap{width:min(440px,100%)}.brand{font-size:28px;font-weight:850;letter-spacing:-.7px;text-align:center;color:#101d37;margin-bottom:22px}.brand span{color:#315fe9}.card{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:30px;box-shadow:0 16px 50px #14213d12}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.7px;color:#315fe9;margin:0 0 9px}h1{font-size:27px;margin:0 0 9px}.sub{color:#657187;font-size:14px;line-height:1.55;margin:0 0 20px}label{display:block;font-size:13px;font-weight:700;margin:14px 0;color:#26344b}input{display:block;width:100%;padding:12px 13px;margin-top:7px;border:1px solid #ccd5e3;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#315fe9;box-shadow:0 0 0 3px #315fe91a}button{width:100%;margin-top:12px;padding:12px 16px;border:0;border-radius:9px;background:#245be8;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#1749cc}.error{padding:10px 12px;border-radius:8px;background:#fff0f0;color:#b42318;font-size:13px;margin:12px 0}.foot{text-align:center;font-size:14px;color:#657187;margin:18px 0 0}.foot a{color:#245be8;font-weight:750;text-decoration:none}@media(max-width:420px){.card{padding:23px}h1{font-size:24px}}
</style></head><body><div class="wrap"><div class="brand">CleanLab <span>AI</span></div><form class="card" method="post" autocomplete="on"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="sub">Sign up to clean, encode, and explore your datasets.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="error" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
<label for="username">Username<input id="username" name="username" minlength="3" maxlength="40" autocomplete="username" required></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required></label><label for="password">Password (minimum 8 characters)<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></label><label for="confirm_password">Confirm password<input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Create account</button></form><p class="foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></body></html>
